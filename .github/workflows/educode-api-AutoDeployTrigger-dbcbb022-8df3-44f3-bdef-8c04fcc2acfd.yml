name: Deploy EduCode API to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.EDUCODEAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.EDUCODEAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.EDUCODEAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: src/EduCode.WebApi/Dockerfile
          containerAppName: educode-api
          resourceGroup: EduCode
          imageToBuild: educode-api:${{ github.sha }}
