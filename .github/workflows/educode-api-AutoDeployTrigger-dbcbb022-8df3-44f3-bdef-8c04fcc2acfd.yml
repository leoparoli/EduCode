name: Deploy EduCode API to Azure Container Apps

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build-and-deploy:
runs-on: ubuntu-latest

permissions:
  id-token: write
  contents: read

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Azure Login
    uses: azure/login@v2
    with:
      client-id: ${{ secrets.EDUCODEAPI_AZURE_CLIENT_ID }}
      tenant-id: ${{ secrets.EDUCODEAPI_AZURE_TENANT_ID }}
      subscription-id: ${{ secrets.EDUCODEAPI_AZURE_SUBSCRIPTION_ID }}

  - name: Login to Azure Container Registry
    uses: docker/login-action@v3
    with:
      registry: educoderegistry.azurecr.io
      username: ${{ secrets.EDUCODEAPI_REGISTRY_USERNAME }}
      password: ${{ secrets.EDUCODEAPI_REGISTRY_PASSWORD }}

  - name: Build Docker image
    run: |
      docker build \
        -f src/EduCode.WebApi/Dockerfile \
        -t educoderegistry.azurecr.io/educode-api:${{ github.sha }} \
        .

  - name: Push Docker image
    run: |
      docker push educoderegistry.azurecr.io/educode-api:${{ github.sha }}

  - name: Deploy to Azure Container Apps
    run: |
      az containerapp update \
        --name educode-api \
        --resource-group EduCode \
        --image educoderegistry.azurecr.io/educode-api:${{ github.sha }}
