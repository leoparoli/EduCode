name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # Esto ubica el entorno exactamente en la carpeta donde está tu Dockerfile
    defaults:
      run:
        working-directory: ./EduCode Version 3.1.3 Azure Email/EduCode.API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t leoparoli/educode-api:latest .

      - name: Push Docker image
        run: docker push leoparoli/educode-api:latest
