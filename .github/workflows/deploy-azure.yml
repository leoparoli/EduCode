name: Deploy EduCode API to Azure

on:
  push:
    branches:
      - main

env:
  REGISTRY: educoderegistry.azurecr.io
  IMAGE_NAME: educode-api
  RESOURCE_GROUP: EduCode
  CONTAINER_APP: educode-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name educoderegistry

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:$IMAGE_TAG \
            .

      - name: Push Docker image
        run: |
          docker push \
            $REGISTRY/$IMAGE_NAME:$IMAGE_TAG

      - name: Deploy Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $REGISTRY/$IMAGE_NAME:$IMAGE_TAG